[workspace]
members = ["tools/thorui-lab", "xtask"]
default-members = ["tools/thorui-lab", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kadajett/thorUI"
rust-version = "1.96"

[workspace.dependencies]
js-sys = "0.3.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

