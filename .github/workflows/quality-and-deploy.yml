name: Quality and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: thorui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 0eed3a2b30da22403053702da618f805
      NO_COLOR: "true"
      THORUI_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'production' || 'candidate' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-0.21.14-${{ runner.os }}-${{ runner.arch }}
      - name: Install toolchains
        run: |
          rustup show
          if ! command -v trunk >/dev/null; then
            cargo install trunk --locked --version 0.21.14
          fi
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gate
        run: pnpm check
      - name: Record current deployment
        if: github.event_name == 'push'
        id: current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          version=$(pnpm exec wrangler deployments status --json | jq -r '.versions[] | select(.percentage == 100) | .version_id')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload candidate version
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler versions upload --strict --tag "$GITHUB_SHA" --preview-alias candidate --message "ThorUI $GITHUB_SHA"
      - name: Smoke candidate version
        if: github.event_name == 'push'
        env:
          THORUI_BASE_URL: https://candidate-thorui-demo.jeremy-ryan-stover.workers.dev
        run: pnpm test:deployed
      - name: Promote candidate version
        if: github.event_name == 'push'
        id: promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler versions deploy --version-tag "$GITHUB_SHA" --message "Promote $GITHUB_SHA" --yes
      - name: Smoke canonical domain
        if: github.event_name == 'push'
        env:
          THORUI_BASE_URL: https://thorui.yougotserved.dev
        run: |
          expected=${GITHUB_SHA:0:12}
          revision=""
          for attempt in {1..15}; do
            revision=$(curl --fail --silent --show-error "$THORUI_BASE_URL/version.json" | jq -r .revision || true)
            if [[ "$revision" == "$expected" ]]; then
              break
            fi
            echo "Waiting for $expected; received $revision (attempt $attempt/15)"
            sleep 2
          done
          [[ "$revision" == "$expected" ]] || exit 1
          pnpm test:deployed
      - name: Restore last green version
        if: failure() && steps.promote.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION: ${{ steps.current.outputs.version }}
        run: pnpm exec wrangler versions deploy "$PREVIOUS_VERSION@100%" --message "Automatic rollback after $GITHUB_SHA" --yes
