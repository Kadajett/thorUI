name: Release Android demo

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NO_COLOR: "true"
      THORUI_CHANNEL: release
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-0.21.14-${{ runner.os }}-${{ runner.arch }}
      - name: Install toolchains
        run: |
          rustup show
          if ! command -v trunk >/dev/null; then
            cargo install trunk --locked --version 0.21.14
          fi
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.THORUI_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thorui-demo.jks"
      - name: Run quality gate
        run: pnpm check
      - name: Build signed APK
        env:
          THORUI_SIGNING_STORE_FILE: ${{ runner.temp }}/thorui-demo.jks
          THORUI_SIGNING_STORE_PASSWORD: ${{ secrets.THORUI_ANDROID_STORE_PASSWORD }}
          THORUI_SIGNING_KEY_ALIAS: ${{ secrets.THORUI_ANDROID_KEY_ALIAS }}
          THORUI_SIGNING_KEY_PASSWORD: ${{ secrets.THORUI_ANDROID_KEY_PASSWORD }}
        run: |
          version=${GITHUB_REF_NAME#v}
          cd hosts/android
          ./gradlew assembleRelease -PthoruiVersion="$version" --warning-mode all
      - name: Verify and name APK
        run: |
          source=hosts/android/app/build/outputs/apk/release/app-release.apk
          target="thorui-demo-$GITHUB_REF_NAME.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$source"
          cp "$source" "$target"
          sha256sum "$target" > "$target.sha256"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "thorui-demo-$GITHUB_REF_NAME.apk" \
            "thorui-demo-$GITHUB_REF_NAME.apk.sha256" \
            --title "ThorUI $GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes
